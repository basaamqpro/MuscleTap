function getYouTubeId(url) {

    try {

        const urlObject = new URL(url);

        return urlObject.searchParams.get("v");

    } catch {

        return null;

    }

}


function getYouTubeThumbnail(url) {

    const videoId = getYouTubeId(url);

    if (!videoId) {

        return "";

    }

    return `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

}


/* =========================================================
   7. BODY MAP
   ========================================================= */

const polygons =
    document.querySelectorAll(".overlay polygon");


polygons.forEach(polygon => {

    polygon.addEventListener("click", () => {

        selectMuscle(polygon.id);

    });


    /*
       Keyboard accessibility.

       Users can focus a polygon with TAB
       and press ENTER or SPACE.
    */

    polygon.addEventListener("keydown", event => {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            selectMuscle(polygon.id);

        }

    });

});


function selectMuscle(muscleId) {

    state.selectedMuscle = muscleId;

    state.selectedType = "All";
    state.selectedEquipment = "All";
    state.searchTerm = "";

    updateSelectedMuscle();

    highlightMuscle(muscleId);

    renderFilters();

    renderWorkouts();

    goToWorkoutPage();

}


function updateSelectedMuscle() {

    const name =
        muscleNames[state.selectedMuscle] ||
        "Workouts";

    selectedMuscleElement.textContent = name;

}


function highlightMuscle(muscleId) {

    polygons.forEach(polygon => {

        polygon.classList.remove("active");

    });


    const selected =
        document.getElementById(muscleId);

    if (selected) {

        selected.classList.add("active");

    }

}


/* =========================================================
   8. FRONT / BACK
   ========================================================= */

swapButton.addEventListener("click", () => {

    if (state.frontVisible) {

        frontWrapper.style.display = "none";
        backWrapper.style.display = "flex";

        state.frontVisible = false;

    } else {

        frontWrapper.style.display = "flex";
        backWrapper.style.display = "none";

        state.frontVisible = true;

    }

});


/* =========================================================
   9. FIND WORKOUTS
   ========================================================= */

function getSelectedWorkouts() {

    if (!state.selectedMuscle) {

        return [];

    }


    let results = workouts.filter(workout =>

        workout.muscle === state.selectedMuscle

    );


    /*
       TYPE FILTER
    */

    if (state.selectedType !== "All") {

        results = results.filter(workout =>

            workout.type.includes(
                state.selectedType
            )

        );

    }


    /*
       EQUIPMENT FILTER
    */

    if (state.selectedEquipment !== "All") {

        results = results.filter(workout =>

            workout.equipment.includes(
                state.selectedEquipment
            )

        );

    }


    /*
       SEARCH
    */

    if (state.searchTerm.trim() !== "") {

        const search =
            state.searchTerm.toLowerCase();

        results = results.filter(workout => {

            return (

                workout.title
                    .toLowerCase()
                    .includes(search)

                ||

                workout.channel
                    .toLowerCase()
                    .includes(search)

            );

        });

    }


    /*
       SORT
    */

    if (state.sort === "title") {

        results.sort((a, b) =>

            a.title.localeCompare(b.title)

        );

    }


    return results;

}


/* =========================================================
   10. FILTER DATA
   ========================================================= */

function getAvailableTypes() {

    const selected =
        workouts.filter(workout =>

            workout.muscle === state.selectedMuscle

        );


    const types = new Set();


    selected.forEach(workout => {

        workout.type.forEach(type => {

            types.add(type);

        });

    });


    return [...types];

}


function getAvailableEquipment() {

    const selected =
        workouts.filter(workout =>

            workout.muscle === state.selectedMuscle

        );


    const equipment = new Set();


    selected.forEach(workout => {

        workout.equipment.forEach(item => {

            equipment.add(item);

        });

    });


    return [...equipment];

}


/* =========================================================
   11. FILTER UI
   ========================================================= */

function renderFilters() {

    genreContainer.innerHTML = "";


    /*
       TYPE FILTERS
    */

    const types = [
        "All",
        ...getAvailableTypes()
    ];


    types.forEach(type => {

        const button =
            document.createElement("button");

        button.textContent = type;

        button.classList.add("filter_button");


        if (state.selectedType === type) {

            button.classList.add("active");

        }


        button.addEventListener("click", () => {

            state.selectedType = type;

            renderFilters();
            renderWorkouts();

        });


        genreContainer.appendChild(button);

    });


    /*
       EQUIPMENT FILTERS
    */

    const equipmentTypes =
        getAvailableEquipment();


    equipmentTypes.forEach(equipment => {

        const button =
            document.createElement("button");

        button.textContent = equipment;

        button.classList.add(
            "equipment_button"
        );


        if (
            state.selectedEquipment === equipment
        ) {

            button.classList.add("active");

        }


        button.addEventListener("click", () => {

            if (
                state.selectedEquipment === equipment
            ) {

                state.selectedEquipment = "All";

            } else {

                state.selectedEquipment = equipment;

            }

            renderFilters();
            renderWorkouts();

        });


        genreContainer.appendChild(button);

    });

}


/* =========================================================
   12. WORKOUT CARD
   ========================================================= */

function createWorkoutCard(workout) {

    const card =
        document.createElement("article");

    card.className = "video_container";

    card.dataset.id = workout.id;


    /*
       THUMBNAIL
    */

    const thumbnail =
        document.createElement("img");

    thumbnail.className = "thumbnail";

    thumbnail.src =
        getYouTubeThumbnail(workout.url);

    thumbnail.alt =
        `${workout.title} thumbnail`;

    thumbnail.loading = "lazy";


    /*
       DETAILS
    */

    const details =
        document.createElement("div");

    details.className =
        "details_container";


    const channel =
        document.createElement("p");

    channel.className =
        "create_channel_name";

    channel.textContent =
        workout.channel;


    const title =
        document.createElement("h2");

    title.className =
        "create_video_title";

    title.textContent =
        workout.title;


    /*
       TYPE LABELS
    */

    const typeContainer =
        document.createElement("div");

    typeContainer.className =
        "video_types";


    workout.type.forEach(type => {

        const tag =
            document.createElement("span");

        tag.className = "video_tag";

        tag.textContent = type;

        typeContainer.appendChild(tag);

    });


    /*
       EQUIPMENT
    */

    const equipment =
        document.createElement("p");

    equipment.className =
        "video_equipment";

    equipment.textContent =
        workout.equipment.join(" • ");


    /*
       ACTIONS
    */

    const actions =
        document.createElement("div");

    actions.className =
        "video_actions";


    const watchButton =
        document.createElement("button");

    watchButton.className =
        "watch_button";

    watchButton.textContent =
        "Watch";


    watchButton.addEventListener("click", () => {

        openVideo(workout);

    });


    const favouriteButton =
        document.createElement("button");

    favouriteButton.className =
        "favourite_button";

    updateFavouriteButton(
        favouriteButton,
        workout.id
    );


    favouriteButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            toggleFavourite(workout.id);

            updateFavouriteButton(
                favouriteButton,
                workout.id
            );

        }
    );


    /*
       BUILD CARD
    */

    details.appendChild(channel);
    details.appendChild(title);
    details.appendChild(typeContainer);
    details.appendChild(equipment);


    actions.appendChild(watchButton);
    actions.appendChild(favouriteButton);


    card.appendChild(thumbnail);
    card.appendChild(details);
    card.appendChild(actions);


    /*
       Clicking the card also opens video.
    */

    card.addEventListener("click", event => {

        if (
            event.target.tagName === "BUTTON"
        ) {

            return;

        }

        openVideo(workout);

    });


    return card;

}


/* =========================================================
   13. RENDER WORKOUTS
   ========================================================= */

function renderWorkouts() {

    menuContainer.innerHTML = "";


    const results =
        getSelectedWorkouts();


    /*
       RESULT COUNT
    */

    const resultCount =
        document.createElement("p");

    resultCount.className =
        "result_count";

    resultCount.textContent =
        `${results.length} workout${
            results.length === 1 ? "" : "s"
        } found`;


    menuContainer.appendChild(resultCount);


    /*
       EMPTY STATE
    */

    if (results.length === 0) {

        const empty =
            document.createElement("div");

        empty.className =
            "empty_state";


        const heading =
            document.createElement("h2");

        heading.textContent =
            "No videos found";


        const text =
            document.createElement("p");

        text.textContent =
            "Try another filter or search.";

        empty.appendChild(heading);
        empty.appendChild(text);

        menuContainer.appendChild(empty);

        return;

    }


    /*
       CREATE CARDS
    */

    results.forEach(workout => {

        const card =
            createWorkoutCard(workout);

        menuContainer.appendChild(card);

    });

}


/* =========================================================
   14. VIDEO PLAYER
   ========================================================= */

function openVideo(workout) {

    state.currentVideo = workout;


    const videoId =
        getYouTubeId(workout.url);


    if (!videoId) {

        return;

    }


    videoContainer.innerHTML = "";


    /*
       PLAYER HEADER
    */

    const header =
        document.createElement("div");

    header.className =
        "video_player_header";


    const title =
        document.createElement("h2");

    title.textContent =
        workout.title;


    const closeButton =
        document.createElement("button");

    closeButton.textContent =
        "×";

    closeButton.className =
        "close_video";


    closeButton.setAttribute(
        "aria-label",
        "Close video"
    );


    closeButton.addEventListener(
        "click",
        closeVideo
    );


    header.appendChild(title);
    header.appendChild(closeButton);


    /*
       YOUTUBE IFRAME
    */

    const iframe =
        document.createElement("iframe");


    iframe.src =
        `https://www.youtube.com/embed/${videoId}`;


    iframe.title =
        workout.title;


    iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";


    iframe.allowFullscreen = true;


    /*
       BUILD PLAYER
    */

    videoContainer.appendChild(header);
    videoContainer.appendChild(iframe);


    videoContainer.style.display =
        "block";


    /*
       SAVE TO HISTORY
    */

    addToHistory(workout.id);

}


/* =========================================================
   15. CLOSE VIDEO
   ========================================================= */

function closeVideo() {

    videoContainer.innerHTML = "";

    videoContainer.style.display =
        "none";

    state.currentVideo = null;

}


/* =========================================================
   16. FAVOURITES
   ========================================================= */

function isFavourite(id) {

    return getFavourites().includes(id);

}


function toggleFavourite(id) {

    let favourites =
        getFavourites();


    if (favourites.includes(id)) {

        favourites =
            favourites.filter(
                favouriteId =>
                    favouriteId !== id
            );

    } else {

        favourites.push(id);

    }


    saveFavourites(favourites);

}


function updateFavouriteButton(
    button,
    id
) {

    if (isFavourite(id)) {

        button.textContent =
            "♥";

        button.classList.add("active");

    } else {

        button.textContent =
            "♡";

        button.classList.remove("active");

    }

}


/* =========================================================
   17. WATCH HISTORY
   ========================================================= */

function addToHistory(id) {

    let history =
        getHistory();


    /*
       Remove existing occurrence.
    */

    history =
        history.filter(
            historyId =>
                historyId !== id
        );


    /*
       Add newest item first.
    */

    history.unshift(id);


    /*
       Keep only latest 20.
    */

    history =
        history.slice(0, 20);


    saveHistory(history);

}


/* =========================================================
   18. PAGE NAVIGATION
   ========================================================= */

function goToWorkoutPage() {

    const pages =
        document.getElementById("all_pages");


    const nextPage =
        document.getElementById("next_page");


    if (!pages || !nextPage) {

        return;

    }


    /*
       Scroll horizontally to Page 2.
    */

    nextPage.scrollIntoView({
        behavior: "smooth",
        block: "nearest",
        inline: "start"
    });

}


/* =========================================================
   19. SEARCH
   =========================================================

   This function can be connected to a search box later.

   Example:

   searchWorkouts("chest");
   ========================================================= */

function searchWorkouts(value) {

    state.searchTerm = value;

    renderWorkouts();

}


/* =========================================================
   20. RESET FILTERS
   ========================================================= */

function resetFilters() {

    state.selectedType = "All";

    state.selectedEquipment = "All";

    state.searchTerm = "";

    renderFilters();

    renderWorkouts();

}


/* =========================================================
   21. GLOBAL ESCAPE KEY
   ========================================================= */

document.addEventListener("keydown", event => {

    if (event.key === "Escape") {

        closeVideo();

    }

});


/* =========================================================
   22. INITIAL STATE
   ========================================================= */

frontWrapper.style.display = "flex";

backWrapper.style.display = "none";

videoContainer.style.display = "none";


/* =========================================================
   23. DEVELOPMENT TEST
   ========================================================= */

console.log(
    `Muscle Map Workout loaded with ${workouts.length} videos.`
);


  </script>

</body>

</html>
