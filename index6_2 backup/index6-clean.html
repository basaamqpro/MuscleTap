    <div id="next_page">

  <script src="index6.js"></script>
  <script>
    excercise_dictionary = {
      all_chest: all_chest,
      only_upper_chest: only_upper_chest,
      lower_chest: lower_chest,
      only_upper_abs: only_upper_abs,
      lower_abs: lower_abs,
      all_abs: all_abs,
      all_legs: all_legs,
      hamstring: hamstring,
      only_quads, only_quads,
      frontal_anterior_deltoids: frontal_anterior_deltoids,
      full_shoulder: full_shoulder,
      full_arms: full_arms,
      full_legs: full_legs,
      biceps: biceps,
      middle_chest: middle_chest,
      serratus: serratus,
      forearms: forearms,
      middle_abs: middle_abs,
      medial_deltoid: medial_deltoid,
      obliques: obliques,
      middle_back: middle_back,
      traps: traps,
      rear_delts: rear_delts,
      rotator_cuffs: rotator_cuffs,
      lats: lats,
      lower_back: lower_back,
      glutes: glutes,
      calves: calves,
      full_back: full_back,
      triceps: triceps,
    }

    var genre_p_type = "all"

    let nodeList = document.querySelectorAll("polygon");
    for (let i = 0; i < nodeList.length; i++) {
      nodeList[i].onclick = function() {
        document.getElementById("MenuContainer").innerHTML = ""
        temp_genre = []
        temp_genre.push("all")
        console.log(this.id)
        keymem = this.id
        if(excercise_dictionary[keymem]) {
          for(a = 0; a<=excercise_dictionary[keymem].length+-1; a++) {
            console.log(excercise_dictionary[keymem][a])
            create_section(excercise_dictionary[keymem][a])
            createGeneres(excercise_dictionary[keymem][a].tag)
          }

          for(c=0; c<=temp_genre.length+-1; c++) {
            var genere_p = document.createElement("p");
            genere_p.innerText = temp_genre[c]

            genere_p.onclick = function() {
              genre_p_type = this.innerText
              document.getElementById("MenuContainer").innerHTML = ""
              for(a = 0; a<=excercise_dictionary[keymem].length+-1; a++) {
                if(genre_p_type == "all") {
                  create_section(excercise_dictionary[keymem][a])
                } else {
                  if(excercise_dictionary[keymem][a].tag == genre_p_type) {
                    create_section(excercise_dictionary[keymem][a])
                  }
                }
              }
            }
          }

          document.getElementById("genre").appendChild(genere_p)
        }
      }
    }

    var frontWrapper = document.getElementById("frontwrapper");
    var backWrapper = document.getElementById("backwrapper");
    frontWrapper.style.display = "flex"

    document.getElementById("swap").onclick = function() {
      if (frontWrapper.style.display === "flex") {
        frontWrapper.style.display = "none";
        backWrapper.style.display = "flex";
      } else {
        frontWrapper.style.display = "flex";
        backWrapper.style.display = "none";
      }
    };

    temp_genre = []

    function createGeneres(tg) {
      console.log("ttttttttttttt"+tg)

      if(temp_genre.includes(tg)) {
        return 2
      } else {
        temp_genre.push(tg)
      }

      console.log(temp_genre)
    }

    function create_section(para) {
      var paralink = para.youtube
      var paramuscle_target = para.muscleTarget
      var para_genre = para.tag
      var parayt_title = para.title
      var para_channel_name = para.channel

      var create_section = "example.com"

      var youtube_profile = document.createElement("div");
      youtube_profile.setAttribute("class", "youtube_profile")

      var createthumbnail = document.createElement("img");
      createthumbnail.setAttribute("class", "createthumbnail");
      createthumbnail.src = getYouTubeThumbnail(paralink)

      var create_channel_name = document.createElement("p");
      create_channel_name.setAttribute("class", "create_channel_name");
      create_channel_name.innerText = para_channel_name;

      var create_video_title = document.createElement("p");
      create_video_title.setAttribute("class", "create_video_title");
      create_video_title.innerText = parayt_title;

      youtube_profile.onclick = function() {
        document.getElementById("youtube_video_container").style.display = "flex";
        playYouTube(paralink)
      }

      youtube_profile.appendChild(createthumbnail);
      youtube_profile.appendChild(create_channel_name);
      youtube_profile.appendChild(create_video_title);

      document.getElementById("MenuContainer").appendChild(youtube_profile)
    }

    function getYouTubeThumbnail(url){
      var videoId = url.split("v=")[1];

      if(videoId.indexOf("&") !== -1){
        videoId = videoId.split("&")[0];
      }

      var thumbnail = "https://img.youtube.com/vi/" + videoId + "/hqdefault.jpg";
      return thumbnail;
    }

    function playYouTube(url) {
      var urlParams = new URLSearchParams(new URL(url).search);
      var videoId = urlParams.get("v");

      if (!videoId) return;

      var embedUrl = "https://www.youtube.com/embed/" + videoId;
      var container = document.getElementById("youtube_player");
      container.innerHTML = "";

      var iframe = document.createElement("iframe");
      iframe.style.width = "100%";
      iframe.height = "315";
      iframe.src = embedUrl;
      iframe.title = "YouTube video player";
      iframe.setAttribute("frameborder", "0");
      iframe.setAttribute(
        "allow",
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      );
      iframe.allowFullscreen = true;

      container.appendChild(iframe);
    }

    document.getElementById("Exityt").onclick = function() {
      document.getElementById("youtube_video_container").style.display = "none";
    }

    document.getElementById("backtodiagram").onclick = function() {
      const container = document.getElementById("all_pages");
      container.scrollTo({
        left: 0,
        behavior: "smooth"
      });
    }
  </script>
