function getYouTubeThumbnail(url){

    var videoId = url.split("v=")[1];

    if(videoId.indexOf("&") !== -1){
        videoId = videoId.split("&")[0];
    }

    var thumbnail = "https://img.youtube.com/vi/" + videoId + "/hqdefault.jpg";

    return thumbnail;
}
